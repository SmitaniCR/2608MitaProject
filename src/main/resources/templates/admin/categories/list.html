<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>カテゴリ管理</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>カテゴリ管理</h1>

    <p id="message" style="color: green;"></p>

    <p><a th:href="@{/admin/books}">書籍管理へ</a></p>

    <a th:href="@{/admin/categories/new}">新規登録</a>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>カテゴリ名</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="category-list">
        </tbody>
    </table>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var editUrlBase = /*[[@{/admin/categories/}]]*/ '/admin/categories/';
        /*]]>*/

        function renderCategories(categories) {
            var $tbody = $('#category-list');
            $tbody.empty();
            $.each(categories, function (i, category) {
                var $row = $('<tr>').attr('data-category-id', category.categoryId);
                $row.append($('<td>').text(category.categoryId));
                $row.append($('<td>').text(category.categoryName));

                var $actions = $('<td>');
                $actions.append($('<a>').attr('href', editUrlBase + category.categoryId + '/edit').text('編集'));
                $actions.append(' ');
                $actions.append($('<button>').attr('type', 'button').addClass('delete-button').text('削除'));

                $row.append($actions);
                $tbody.append($row);
            });
        }

        function loadCategories() {
            $.getJSON('/api/categories', function (data) {
                renderCategories(data);
            });
        }

        $(function () {
            loadCategories();

            $('#category-list').on('click', '.delete-button', function () {
                if (!confirm('削除してよろしいですか？')) {
                    return;
                }
                var $row = $(this).closest('tr');
                var categoryId = $row.data('category-id');

                $.ajax({
                    url: '/api/categories/' + categoryId,
                    type: 'DELETE',
                    success: function () {
                        $row.remove();
                        $('#message').text('カテゴリを削除しました');
                    },
                    error: function (xhr) {
                        var message = (xhr.responseJSON && xhr.responseJSON.message) || '削除に失敗しました';
                        alert(message);
                    }
                });
            });
        });
    </script>
</body>
</html>
