<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>カテゴリ管理</title>
</head>
<body>
    <h1>カテゴリ管理</h1>

    <p th:if="${message}" th:text="${message}" style="color: green;"></p>

    <p><a th:href="@{/admin/books}">書籍管理へ</a></p>

    <a th:href="@{/admin/categories/new}">新規登録</a>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>カテゴリ名</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.categoryId}"></td>
                <td th:text="${category.categoryName}"></td>
                <td>
                    <a th:href="@{/admin/categories/{id}/edit(id=${category.categoryId})}">編集</a>
                    <form th:action="@{/admin/categories/{id}/delete(id=${category.categoryId})}" method="post" style="display:inline;"
                          onsubmit="return confirm('削除してよろしいですか？');">
                        <button type="submit">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
