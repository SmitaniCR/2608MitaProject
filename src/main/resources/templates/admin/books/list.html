<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>書籍管理</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h1>書籍管理</h1>

    <p id="message" style="color: green;"></p>

    <p><a th:href="@{/admin/categories}">カテゴリ管理へ</a></p>

    <a th:href="@{/admin/books/new}">新規登録</a>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>タイトル</th>
                <th>著者</th>
                <th>ISBN</th>
                <th>カテゴリ</th>
                <th>総冊数</th>
                <th>貸出可能数</th>
                <th>出版日</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="book-list">
        </tbody>
    </table>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var editUrlBase = /*[[@{/admin/books/}]]*/ '/admin/books/';
        /*]]>*/

        function renderBooks(books) {
            var $tbody = $('#book-list');
            $tbody.empty();
            $.each(books, function (i, book) {
                var $row = $('<tr>').attr('data-book-id', book.bookId);
                $row.append($('<td>').text(book.bookId));
                $row.append($('<td>').text(book.title));
                $row.append($('<td>').text(book.author));
                $row.append($('<td>').text(book.isbn));
                $row.append($('<td>').text(book.categoryName));
                $row.append($('<td>').text(book.totalCopies));
                $row.append($('<td>').text(book.availableCopies));
                $row.append($('<td>').text(book.publishedDate));

                var $actions = $('<td>');
                $actions.append($('<a>').attr('href', editUrlBase + book.bookId + '/edit').text('編集'));
                $actions.append(' ');
                $actions.append($('<button>').attr('type', 'button').addClass('delete-button').text('削除'));

                $row.append($actions);
                $tbody.append($row);
            });
        }

        function loadBooks() {
            $.getJSON('/api/books', function (data) {
                renderBooks(data);
            });
        }

        $(function () {
            loadBooks();

            $('#book-list').on('click', '.delete-button', function () {
                if (!confirm('削除してよろしいですか？')) {
                    return;
                }
                var $row = $(this).closest('tr');
                var bookId = $row.data('book-id');

                $.ajax({
                    url: '/api/books/' + bookId,
                    type: 'DELETE',
                    success: function () {
                        $row.remove();
                        $('#message').text('書籍を削除しました');
                    },
                    error: function (xhr) {
                        var message = (xhr.responseJSON && xhr.responseJSON.message) || '削除に失敗しました';
                        alert(message);
                    }
                });
            });
        });
    </script>
</body>
</html>
