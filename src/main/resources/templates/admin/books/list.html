<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>書籍管理</title>
</head>
<body>
    <h1>書籍管理</h1>

    <p th:if="${message}" th:text="${message}" style="color: green;"></p>

    <p><a th:href="@{/admin/categories}">カテゴリ管理へ</a></p>

    <a th:href="@{/admin/books/new}">新規登録</a>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>タイトル</th>
                <th>著者</th>
                <th>ISBN</th>
                <th>カテゴリ</th>
                <th>総冊数</th>
                <th>貸出可能数</th>
                <th>出版日</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.bookId}"></td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.author}"></td>
                <td th:text="${book.isbn}"></td>
                <td th:text="${book.category != null ? book.category.categoryName : ''}"></td>
                <td th:text="${book.totalCopies}"></td>
                <td th:text="${book.availableCopies}"></td>
                <td th:text="${book.publishedDate}"></td>
                <td>
                    <a th:href="@{/admin/books/{id}/edit(id=${book.bookId})}">編集</a>
                    <form th:action="@{/admin/books/{id}/delete(id=${book.bookId})}" method="post" style="display:inline;"
                          onsubmit="return confirm('削除してよろしいですか？');">
                        <button type="submit">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
