<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>書籍登録・編集</title>
</head>
<body>
    <h1 th:text="${bookForm.bookId} != null ? '書籍編集' : '書籍登録'"></h1>

    <form th:action="${bookForm.bookId} != null
                ? @{/admin/books/{id}/edit(id=${bookForm.bookId})}
                : @{/admin/books/new}"
          th:object="${bookForm}" method="post">

        <input type="hidden" th:field="*{bookId}" />

        <div>
            <label for="title">タイトル</label>
            <input type="text" id="title" th:field="*{title}" />
            <span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color: red;"></span>
        </div>

        <div>
            <label for="author">著者</label>
            <input type="text" id="author" th:field="*{author}" />
            <span th:if="${#fields.hasErrors('author')}" th:errors="*{author}" style="color: red;"></span>
        </div>

        <div>
            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" th:field="*{isbn}" />
            <span th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}" style="color: red;"></span>
        </div>

        <div>
            <label for="categoryId">カテゴリ</label>
            <select id="categoryId" th:field="*{categoryId}">
                <option value="">未選択</option>
                <option th:each="category : ${categories}"
                        th:value="${category.categoryId}"
                        th:text="${category.categoryName}"></option>
            </select>
        </div>

        <div>
            <label for="totalCopies">総冊数</label>
            <input type="number" id="totalCopies" th:field="*{totalCopies}" />
            <span th:if="${#fields.hasErrors('totalCopies')}" th:errors="*{totalCopies}" style="color: red;"></span>
        </div>

        <div>
            <label for="availableCopies">貸出可能冊数</label>
            <input type="number" id="availableCopies" th:field="*{availableCopies}" />
            <span th:if="${#fields.hasErrors('availableCopies')}" th:errors="*{availableCopies}" style="color: red;"></span>
        </div>

        <div>
            <label for="publishedDate">出版日</label>
            <input type="date" id="publishedDate" th:field="*{publishedDate}" />
            <span th:if="${#fields.hasErrors('publishedDate')}" th:errors="*{publishedDate}" style="color: red;"></span>
        </div>

        <div>
            <label for="description">説明</label>
            <textarea id="description" th:field="*{description}" rows="5" cols="40"></textarea>
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color: red;"></span>
        </div>

        <button type="submit">保存</button>
        <a th:href="@{/admin/books}">一覧に戻る</a>
    </form>
</body>
</html>
